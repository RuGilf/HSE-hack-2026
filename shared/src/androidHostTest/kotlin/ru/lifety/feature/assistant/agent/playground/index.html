<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="playground-token" content="__TOKEN__"><title>Lifety · Agent Lab</title>
<style nonce="__TOKEN__">
:root{color-scheme:dark;--bg:#101512;--surface:#1d2520;--raised:#263229;--accent:#35ef70;--text:#f4f7f3;--muted:#9baa9f;--line:#34473a;--error:#ff817d;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,textarea{font:inherit}button{cursor:pointer;color:inherit;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:9px 14px}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header{display:flex;gap:18px;align-items:center;padding:22px 28px;border-bottom:1px solid var(--line)}.brand{font-weight:750;font-size:20px;letter-spacing:-.6px}.brand span{color:var(--muted);font-size:13px;font-weight:400;letter-spacing:.1px;margin-left:10px}.pill{color:var(--accent);border:1px solid var(--line);border-radius:99px;font-size:12px;padding:5px 10px}.header-actions{display:flex;gap:8px;margin-left:auto}.subhead{padding:16px 28px;display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12px}.dot{height:8px;width:8px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:7px}.dot.busy{animation:pulse 1s infinite}.subhead #model{margin-left:auto;overflow-wrap:anywhere}#layout{display:grid;grid-template-columns:minmax(380px,1.45fr) minmax(330px,1fr);gap:18px;padding:0 28px 24px;max-width:1600px;margin:auto}.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden}.chat{height:calc(100vh - 145px);min-height:570px;display:flex;flex-direction:column}.panel-title{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.panel-title strong{font-size:16px}.muted{color:var(--muted)}.small{font-size:12px}#messages{overflow:auto;flex:1;padding:22px;scroll-behavior:smooth}h1{font-size:28px;line-height:1.2;letter-spacing:-.7px;font-weight:650;margin:0 0 12px}.intro{max-width:560px;padding-top:12px}.intro p{color:var(--muted);margin:0 0 22px}.suggestions{display:grid;gap:8px}.suggestions button{text-align:left;background:transparent;padding:12px 14px}.suggestions button small{display:block;color:var(--muted);margin-top:2px}.message{margin:0 0 18px;white-space:pre-wrap;overflow-wrap:anywhere}.message .who{color:var(--muted);font-size:11px;letter-spacing:.7px;text-transform:uppercase;margin-bottom:5px}.message.user{background:var(--raised);padding:13px 16px;border-radius:16px;margin-left:25px}.message.agent{padding:3px 0}.trace{margin:0 0 10px;font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--muted)}.trace summary{cursor:pointer;overflow-wrap:anywhere}.trace pre{white-space:pre-wrap;max-height:220px;overflow:auto;background:var(--bg);padding:12px;border-radius:12px}.proposal{border:1px solid var(--accent);border-radius:16px;margin:16px 0;padding:15px}.proposal strong{color:var(--accent)}.proposal pre{font:12px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:240px;overflow:auto}.row{display:flex;gap:8px;align-items:center}.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:650}.danger{color:var(--error)}#composer{border-top:1px solid var(--line);padding:16px}textarea{width:100%;resize:vertical;min-height:76px;max-height:230px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px 14px}#composer .row{justify-content:space-between;margin-top:8px}.inspector{height:calc(100vh - 145px);min-height:570px;display:flex;flex-direction:column}.tabs{display:flex;padding:12px;gap:6px;border-bottom:1px solid var(--line)}.tabs button{flex:1;background:transparent;border-color:transparent}.tabs button[aria-selected="true"]{background:var(--raised);border-color:var(--line);color:var(--accent)}.view{overflow:auto;padding:18px;flex:1}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}.metric{background:var(--bg);padding:14px;border-radius:16px}.metric b{display:block;font-size:24px;font-weight:600;letter-spacing:-.5px}.metric span{font-size:11px;color:var(--muted)}h2{font-size:15px;font-weight:650;margin:20px 0 10px}h2:first-child{margin-top:0}.record{border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:10px;justify-content:space-between}.record:last-child{border:0}.record .meta{font-size:11px;color:var(--muted)}.money{font-variant-numeric:tabular-nums;white-space:nowrap}.file{width:100%;display:block;text-align:left;margin-bottom:6px;background:transparent;font:12px/1.4 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}.file small{color:var(--muted)}#fileText{font:12px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;background:var(--bg);border-radius:12px}#fileName{overflow-wrap:anywhere;font:12px ui-monospace,Consolas,monospace}.fact{padding:13px 0;border-bottom:1px solid var(--line)}.fact .quote{font-size:12px;color:var(--muted);margin:7px 0}.empty{color:var(--muted);padding:12px 0}.foot{padding:12px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}#notice{margin:0 28px 12px;padding:10px 15px;border:1px solid var(--error);color:var(--error);border-radius:12px;display:none}.hidden{display:none!important}@keyframes pulse{50%{opacity:.25}}@media(max-width:900px){header{padding:16px;flex-wrap:wrap;gap:10px}.brand span{display:none}.header-actions button{font-size:12px;padding:7px 10px}.subhead{padding:12px 16px}#layout{display:block;padding:0 16px 16px}.chat{height:72vh;min-height:520px;margin-bottom:16px}.inspector{height:600px;min-height:0}#messages{padding:18px}#notice{margin:0 16px 12px}.subhead #model{font-size:10px;max-width:50%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}
</style></head><body>
<header><div class="brand">lifety<span>AGENT LAB</span></div><span class="pill">Синтетические данные</span><div class="header-actions"><button id="newChat">Новый диалог</button><button id="reset">Сбросить демо</button></div></header>
<div class="subhead"><span id="status"><i class="dot"></i>Готов к работе</span><span id="usage"></span><span id="model"></span></div>
<div id="notice" role="alert"></div>
<div id="layout"><main class="panel chat"><div class="panel-title"><strong>Поговори с агентом</strong><span class="small muted">Kotlin · QuickJS · локальные файлы</span></div><div id="messages" aria-live="polite"></div><form id="composer"><label for="input" class="hidden">Сообщение агенту</label><textarea id="input" placeholder="Например: разберись, куда уходят деньги, и сохрани отчёт…" maxlength="8000" rows="3"></textarea><div class="row"><span class="small muted">Enter — отправить · Shift+Enter — перенос</span><div class="row"><button type="button" id="cancel" class="danger hidden">Остановить</button><button class="primary" id="send" type="submit">Отправить</button></div></div></form></main>
<aside class="panel inspector"><div class="tabs" role="tablist"><button data-tab="data" role="tab" aria-selected="true">Данные</button><button data-tab="files" role="tab" aria-selected="false">Файлы</button><button data-tab="memory" role="tab" aria-selected="false">Память</button></div><section id="dataView" class="view"></section><section id="filesView" class="view hidden"><div id="fileList"></div><div id="filePreview" class="hidden"><div class="row"><button id="fileBack">← Файлы</button><button id="fileDownload">Скачать</button></div><p id="fileName"></p><pre id="fileText"></pre></div></section><section id="memoryView" class="view hidden"></section><div class="foot">Стартовые записи вымышлены. Сообщения и прочитанные агентом данные отправляются в выбранный LLM API. База Lifety не подключена.</div></aside></div>
<script nonce="__TOKEN__">
const $=id=>document.getElementById(id), token=document.querySelector('meta[name="playground-token"]').content;
let current=null, tab='data', lastMessages='', lastData='', lastMemory='', currentFile=null, sending=false, fetching=false;
const node=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
const date=timestamp=>new Date(timestamp).toLocaleDateString('ru-RU',{timeZone:'Europe/Moscow',day:'numeric',month:'short'});
const amount=(value,currency)=>{const n=BigInt(value);return (n/100n).toLocaleString('ru-RU')+','+(n%100n).toString().padStart(2,'0')+' '+currency};
function notice(text){$('notice').textContent=text||'';$('notice').style.display=text?'block':'none'}
async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'X-Playground-Token':token,'Content-Type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)})});const data=await r.json();if(!r.ok)throw Error(data.message||'Операция не завершена');return data}
async function action(name,body={}){try{await api('/api/'+name,body);await poll();if(tab==='files')await loadFiles()}catch(e){notice(e.message)}}
function choosePrompt(text){$('input').value=text;$('input').focus()}
function intro(){const box=node('div',undefined,'intro');box.append(node('h1','Своя среда. Реальные действия.'),node('p','Агент сам исследует файлы, пишет и запускает код. Открой действия в диалоге или готовые отчёты во вкладке «Файлы».'));const list=node('div',undefined,'suggestions');[
['Разобрать расходы','Сколько потрачено за последние 7 суток по категориям и валютам? Напиши и выполни скрипт, проверь расчёт и сохрани отчёт.','29 вымышленных покупок, RUB и USD'],
['Спланировать завтра','Посмотри задачи и предложи реалистичный план на завтра. Предложи добавить одну полезную задачу через подтверждение.','Изменения появятся после подтверждения'],
['Исследовать сон и шаги','В scratch/demo-health-history.csv лежат 14 дней синтетических данных сна и шагов. Проанализируй их скриптом, найди закономерности и ограничения данных, сохрани отчёт.','Дополнительный CSV в рабочей папке'],
['Проверить память','Запомни: я предпочитаю учиться вечером.','Подтверди запись, затем начни новый диалог']
].forEach(([title,prompt,hint])=>{const b=node('button');b.type='button';b.append(node('span',title),node('small',hint));b.addEventListener('click',()=>choosePrompt(prompt));list.append(b)});box.append(list);return box}
function renderMessages(s){const fingerprint=JSON.stringify([s.document.messages,s.document.proposals,s.busy]);if(fingerprint===lastMessages)return;lastMessages=fingerprint;const box=$('messages'),bottom=box.scrollHeight-box.scrollTop-box.clientHeight<100;box.replaceChildren();if(!s.document.messages.length)box.append(intro());
const names=new Map(s.document.messages.flatMap(m=>m.calls||[]).map(c=>[c.id,c.name]));
for(const m of s.document.messages){if(m.role==='tool'){const d=node('details',undefined,'trace');let status='';try{status=JSON.parse(m.text).status||''}catch{}d.append(node('summary',(names.get(m.callId)||m.callId)+' · '+status),node('pre',m.text));box.append(d);continue}const div=node('div',undefined,'message '+(m.role==='user'?'user':'agent'));div.append(node('div',m.role==='user'?(m.text.startsWith('APP_RECEIPT:')?'Действие подтверждено':'Ты'):'Lifety','who'));if(m.text)div.append(node('div',m.text));if(m.calls?.length){const d=node('details',undefined,'trace');d.append(node('summary','Вызов: '+m.calls.map(c=>c.name).join(', ')),node('pre',m.calls.map(c=>c.name+'\n'+c.arguments).join('\n\n')));div.append(d)}box.append(div)}
for(const p of s.document.proposals.filter(p=>['pending','applying'].includes(p.status))){const card=node('section',undefined,'proposal');card.append(node('strong','Подтвердить действие · '+p.kind),node('pre',JSON.stringify(p.body,null,2)));if(p.expected!==null){const before=node('details');before.append(node('summary','Было'),node('pre',JSON.stringify(p.expected,null,2)));card.append(before)}const row=node('div',undefined,'row');for(const [label,kind]of [['Применить','approve'],['Отклонить','reject']]){const b=node('button',label,kind==='approve'?'primary':'');b.disabled=s.busy;b.addEventListener('click',()=>action(kind,{id:p.id}));row.append(b)}card.append(row);box.append(card)}if(bottom)box.scrollTop=box.scrollHeight}
function renderData(s){const key=JSON.stringify([s.expenses,s.tasks,s.health]);if(key===lastData)return;lastData=key;const box=$('dataView');box.replaceChildren();const totals={};for(const r of s.expenses)totals[r.currency]=(totals[r.currency]||0n)+BigInt(r.amountMinor);const metrics=node('div',undefined,'metrics');for(const [c,v]of Object.entries(totals)){const m=node('div',undefined,'metric');m.append(node('b',amount(v,c)),node('span','Всего в демо-наборе'));metrics.append(m)}box.append(metrics,node('h2','Задачи'));for(const t of s.tasks){const r=node('div',undefined,'record'),d=node('div');d.append(node('div',(t.isCompleted?'✓ ':'○ ')+t.title.replace('[ДЕМО] ','')),node('div',t.deadlineAt?'Дедлайн: '+date(t.deadlineAt):t.scheduledAt?'План: '+date(t.scheduledAt):'Без даты','meta'));r.append(d);box.append(r)}box.append(node('h2','Последний снимок здоровья'));if(s.health)box.append(node('div',Math.floor(s.health.sleepMinutes/60)+' ч '+s.health.sleepMinutes%60+' мин сна · '+s.health.steps.toLocaleString('ru-RU')+' шагов'));box.append(node('p','История за 14 дней отдельно: scratch/demo-health-history.csv','muted small'),node('h2','Расходы · '+s.expenses.length+' записей'));for(const x of s.expenses){const r=node('div',undefined,'record'),d=node('div');d.append(node('div',x.merchant.replace('[ДЕМО] ','')),node('div',date(x.timestamp)+' · '+x.category,'meta'));r.append(d,node('span',amount(x.amountMinor,x.currency),'money'));box.append(r)}}
function renderMemory(s){const key=JSON.stringify(s.document.facts);if(key===lastMemory)return;lastMemory=key;const box=$('memoryView');box.replaceChildren(node('h2','Подтверждённая память'));if(!s.document.facts.length)box.append(node('p','Пока пусто. Попроси агента запомнить предпочтение, затем подтверди предложение. После нового диалога факт останется.','empty'));for(const f of s.document.facts){const card=node('div',undefined,'fact');card.append(node('strong',f.key+': '+f.value),node('div','Источник: «'+f.sourceQuote+'»','quote'),node('div',f.domain+' · '+date(f.updatedAt),'small muted'));const b=node('button','Забыть','danger');b.addEventListener('click',()=>{if(confirm('Удалить этот факт? Чат и производные файлы будут очищены, чтобы сведение не вернулось из старой заметки.'))action('forget',{id:f.id})});card.append(b);box.append(card)}}
async function poll(){if(fetching)return;fetching=true;try{const s=await api('/api/state');current=s;$('status').replaceChildren(node('i',undefined,'dot'+(s.busy?' busy':'')),document.createTextNode(s.busy?'Агент работает':s.phase==='ERROR'?'Ошибка запуска':'Готов к работе'));$('usage').textContent=s.modelCalls+' шагов API'+(s.promptTokens?' · '+s.promptTokens+' входных токенов':'');$('model').textContent=s.model;$('send').disabled=s.busy||sending;$('cancel').classList.toggle('hidden',!s.busy);$('newChat').disabled=s.busy;$('reset').disabled=s.busy;notice(s.phase==='ERROR'?s.error:null);renderMessages(s);renderData(s);renderMemory(s)}catch(e){notice('Песочница недоступна: '+e.message)}finally{fetching=false}}
async function loadFiles(){try{const files=await api('/api/files'),box=$('fileList');box.replaceChildren(node('h2','Рабочая папка · '+files.length+' файлов'));for(const f of files){const b=node('button',undefined,'file');b.append(node('div',f.path),node('small',f.bytes.toLocaleString('ru-RU')+' Б'));b.addEventListener('click',()=>openFile(f.path));box.append(b)}}catch(e){notice(e.message)}}
async function openFile(path){try{const f=await api('/api/file?path='+encodeURIComponent(path));currentFile=f;$('fileName').textContent=f.path+(f.length>60000?' · показана первая часть, скачивание — целиком':'');let text=f.text.slice(0,60000);try{text=JSON.stringify(JSON.parse(text),null,2)}catch{}$('fileText').textContent=text;$('fileList').classList.add('hidden');$('filePreview').classList.remove('hidden')}catch(e){notice(e.message)}}
for(const b of document.querySelectorAll('[data-tab]'))b.addEventListener('click',()=>{tab=b.dataset.tab;for(const t of document.querySelectorAll('[data-tab]'))t.setAttribute('aria-selected',String(t===b));for(const name of ['data','files','memory'])$(name+'View').classList.toggle('hidden',name!==tab);if(tab==='files'){currentFile=null;$('filePreview').classList.add('hidden');$('fileList').classList.remove('hidden');loadFiles()}});
$('composer').addEventListener('submit',async e=>{e.preventDefault();const message=$('input').value.trim();if(!message||sending||current?.busy)return;sending=true;$('send').disabled=true;try{await api('/api/send',{message});$('input').value='';await poll()}catch(e){notice(e.message)}finally{sending=false}});
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}});
$('cancel').addEventListener('click',()=>action('cancel'));
$('newChat').addEventListener('click',()=>{if(confirm('Начать новый диалог? Файлы и подтверждённая память сохранятся.'))action('new-chat')});
$('reset').addEventListener('click',()=>{if(confirm('Сбросить песочницу? Демо-данные восстановятся, переписка, память и рабочие файлы будут удалены.')){lastMessages='';lastData='';lastMemory='';action('reset')}});
$('fileBack').addEventListener('click',()=>{$('filePreview').classList.add('hidden');$('fileList').classList.remove('hidden');loadFiles()});
$('fileDownload').addEventListener('click',()=>{if(!currentFile)return;const a=node('a');a.href=URL.createObjectURL(new Blob([currentFile.text],{type:'text/plain;charset=utf-8'}));a.download=currentFile.path.split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
poll();setInterval(poll,900);setInterval(()=>{if(tab==='files'&&!currentFile)loadFiles()},4000);
</script></body></html>
